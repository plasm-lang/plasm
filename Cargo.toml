[workspace]
members = [
    "diagnostic",
    "tokenizer",
    "ast",
    "hir",
    "mir",
    "codegen",
    "orchestrator",
    "cli",
    "utils",
]
resolver = "3"

[workspace.dependencies]
indoc = { version = "2.0.7"}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
bimap = { version = "0.6.3", features = ["serde"] }
strum = "0.28.0"
strum_macros = "0.28.0"
